  - 减少计时
entities:
  - time
  - step
  - weight

slots:
  time:
    type: text
    mappings:
      - type: from_entity
        entity: time

  step:
    type: text
    mappings:
      - type: from_entity
        entity: step

  weight:
    type: text
    mappings:
      - type: from_entity
        entity: weight

responses:
  utter_软化黄油:
    - text: "切块隔水软化：将黄油切成小块，放入一个小碗中，然后将碗放入50度左右的温水中。确保水不要太热，不烫手就刚好，避免黄油融化。请看示意图。"

  utter_软化成功:
    - text: "按压测试：用手指轻轻按压黄油，或使用搅拌棒轻压黄油，可以基本无阻力的插入，且黄油保持一定形态，黄油就软化完成了。请看视频。"

  utter_搅打黄油:
    - text: "电动打蛋器打发黄油：首先安装好电动打蛋器，然后向上推按钮，至低速档或中速档进行打发。"

  utter_软化黄油原因:
    - text: "软化黄油是为了与其他配料更容易混合均匀。软化黄油更容易被打发，空气的加入会使烘焙成品更加轻盈和蓬松。"

  utter_细砂糖选择原因:
    - text: "在烘焙过程中，细砂糖因其较小的颗粒，更容易融化并与黄油或液体混合，从而提高打发效果，使烘焙成品更加轻盈。"

  utter_打发黄油重要性:
    - text: "打发黄油在烘焙中至关重要，它能增加空气量、改善质地、混合均匀，为面团提供结构支撑。"

  utter_黄油打发程度:
    - text: "请看对比图。如果达到图上的这种程度，黄油和白砂糖充分混合，且微微发白，黄油就搅打好了。"

  utter_电动打蛋器安装:
    - text: "请看示意图。电动打蛋器分公母头，请将六边形的一头插在左边画有六边形图案的插口下方，请将圆形的插头插在右边有圆形图案的插口下方。"

  utter_蛋白液作用:
    - text: "因为蔓越莓饼干是水果风味的饼干，加入蛋白液能够突出水果的风味。烤出的饼干颜色也较为明艳。"

  utter_蛋液分离器使用:
    - text: "确保蛋液分离器和盛取蛋液的小碗无水切干净，轻轻敲开鸡蛋，将蛋放在分离器上，让蛋白流过外围的缝隙滴入容器。"

  utter_完全乳化标准:
    - text: "请看对比图。如果达到图上的这种程度，糖油混合物和蛋液充分混合，体积微微膨胀且颜色发白，就乳化好了。"

  utter_切蔓越莓干:
    - text: "请看视频。"

  utter_蔓越莓干大小:
    - text: "请看示意图。将蔓越莓干切成小颗粒即可。"

  utter_搅拌蔓越莓干:
    - text: "用刮刀轻搅，将蔓越莓干与面粉充分混合即可。请看视频。"

  utter_十字拌和法:
    - text: "您需要用十字拌和法，像炒菜一样，用刮刀边搅拌，边按压，这样很快就可以充分混合面粉和糖油混合物。"

  utter_铺保鲜膜:
    - text: "由于模具较长，请将保鲜膜横拉出后截断，铺设在模具上。请看示意图。"

  utter_放面团:
    - text: "用刮刀从容器中取适量面团，依次放入模具，然后抹平。请看视频。"

  utter_塑形面团:
    - text: "将模具中的面团压紧实，两头压平。 请看视频。"

  utter_冷冻面团:
    - text: "冷冻面团是为了固定形状、便于切割、控制膨胀、防止过度混合和提高烘焙质量。"

  utter_厚度:
    - text: "5毫米，相当于一根普通圆珠笔芯的直径左右。您也可以参考示意图。"

  utter_太薄:
    - text: "饼干越薄，口感越脆；如果想要酥松的口感，建议适当缩短烘烤时间。"

  utter_太厚:
    - text: "饼干越厚，口感越酥松，但不易烤熟，建议适当延长烘烤时间。"

  utter_模具冷冻:
    - text: "可以，面团无需从模具中取出，可以更好的塑形。"

  utter_冷藏还是冷冻:
    - text: "冷藏的速度较慢。可能需要3-5个小时。"

  utter_铺油纸:
    - text: "您可以裁剪和烤盘内缘一样大小的油纸，直接铺在烤盘中。参考示意图。"

  utter_饼干间距:
    - text: "您需要先在烤盘中铺好油纸，然后上下左右间隔7毫米左右，将饼干均匀的摆在烤盘上。参考示意图。"

  utter_预热烤箱:
    - text: "烤箱上有两个旋钮，上面的旋钮是上火，下面的旋钮是下火。将时间旋钮逆时针转动即可开始预热。"

  utter_饼干太多:
    - text: "您可以将剩余的饼干放置在铺好油纸的烤架上，将烤架放在烤箱上层，烤盘放在烤箱下层进行烘烤。"

  utter_饼干烘烤时间长:
    - text: "烘烤时间越长，饼干的颜色越深，口感越脆。如果烘烤时间过长，饼干会变得过于硬脆，甚至烧焦。"

  utter_饼干烘烤时间短:
    - text: "饼干烘烤时间不足会导致饼干中心部分过于柔软，口感不酥脆。"

  utter_去皮:
    - text: "食品秤已调零。"

  utter_第一步:
    - text: "第一步是：软化黄油，在黄油中加入细砂糖，搅打至黄油微微发白，得到糖油混合物。"

  utter_第二步:
    - text: "第二步是：在糖油混合物中加入蛋白液，搅打至完全乳化，得到混合物（A）。"

  utter_第三步:
    - text: "第三步是：切碎蔓越莓干，将蔓越莓干碎加入低筋面粉，充分搅拌，得到混合物（B）。"

  utter_第四步:
    - text: "第四步是：将（A）和（B）充分混合得到面团，将面团放入铺有保鲜膜的模具塑形。"

  utter_第五步:
    - text: "第五步是：将塑形后的面团放到冰箱中冷冻30分钟，面团变硬后取出，切成约0.5厘米的薄片。"

  utter_第六步:
    - text: "第六步是：烤箱预热，上火160度，下火150度。铺油纸，摆好饼干。烘烤约20分钟取出，静置冷却。"

  utter_询问混合物A:
    - text: "混合物（A）是糖、油和蛋白液的混合物。"

  utter_询问混合物B:
    - text: "混合物（B）是蔓越莓干和低筋面粉的混合物。"

  utter_default:
    - text: "No Response"

session_config:
  session_expiration_time: 60
  carry_over_slots_to_new_session: true
