  - 饼干太多
  - 饼干烘烤时间长
  - 饼干烘烤时间短
  - 去皮
  - 第一步
  - 第二步
  - 第三步
  - 第四步
  - 第五步
  - 第六步
  - 询问混合物A
  - 询问混合物B
  - 回到上一步
  - 回到下一步
  - 步骤跳转
  - 跳转第一个页面
  - 跳转第三个页面
  - 增加低筋面粉
  - 称量低筋面粉
  - 减少低筋面粉
  - 称量黄油
  - 增加黄油
  - 减少黄油
  - 称量白砂糖
  - 增加白砂糖
  - 减少白砂糖
